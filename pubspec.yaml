name: azm
description: Azm - Personal discipline and habit building app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  intl: ^0.20.3
  material_ui: ^1.11.0
  sqflite: ^2.4.6
  path: ^1.9.1
  path_provider: ^2.1.6
  supabase_flutter: ^2.18.3
  flutter_local_notifications: ^23.0.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  image_picker: ^1.2.4
  fl_chart: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
