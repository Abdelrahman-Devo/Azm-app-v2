name: Migrate Probe

on:
  workflow_dispatch:
  push:
    branches: [ 'claude/probe-**' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter create --platforms=android --org com.azm .
      - run: git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm base
      - run: flutter pub get
      - run: dart fix --apply --code=migrate_design_widgets || true
      - name: Show migration diff
        run: git diff -- lib test pubspec.yaml pubspec.lock | head -400
      - run: cat pubspec.yaml
