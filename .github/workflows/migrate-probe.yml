name: Migrate Probe

on:
  workflow_dispatch:
  push:
    branches: [ 'claude/probe-**' ]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter create --platforms=android --org com.azm --project-name azm .
      - name: Resolve candidate packages
        run: |
          flutter pub add material_ui flutter_riverpod sqflite path path_provider supabase_flutter \
            flutter_local_notifications timezone flutter_timezone image_picker fl_chart \
            shared_preferences uuid intl crypto flutter_secure_storage
          flutter pub add --dev sqflite_common_ffi
          echo "=== PUBSPEC ==="; cat pubspec.yaml
      - name: Dump package APIs 2
        run: |
          MU=$(ls -d $HOME/.pub-cache/hosted/pub.dev/material_ui-1*)
          echo "=== material_ui lib ==="; ls $MU/lib | head -30
          echo "=== material_ui exports ==="; cat $MU/lib/material_ui.dart | grep -v '^//' | head -40
          echo "=== localization symbols ==="; grep -rn -E 'class GlobalMaterialLocalizations|delegates =>|static const LocalizationsDelegate' $MU/lib | head -20
          echo "=== README ==="; grep -n -i -B2 -A10 -E 'locali' $MU/README.md | head -60
          echo "=== app.dart localization defaults ==="; grep -rn -E 'localizationsDelegates|_MaterialLocalizationsDelegate|DefaultMaterialLocalizations' $MU/lib/src/*/app.dart 2>/dev/null | head -20; grep -rln 'class MaterialApp' $MU/lib | head
          FTZ=$(ls -d $HOME/.pub-cache/hosted/pub.dev/flutter_timezone-5*)
          echo "=== flutter_timezone API ==="; ls $FTZ/lib; grep -rn -E 'static|Future<' $FTZ/lib/flutter_timezone.dart | head -20; grep -rn -E 'class TimezoneInfo' -A12 $FTZ/lib | head -25
      - name: Show generated android files
        run: |
          echo "=== TREE ==="; find android -type f -not -path '*/res/*' | sort
          for f in android/app/build.gradle* android/build.gradle* android/settings.gradle* android/gradle/wrapper/gradle-wrapper.properties android/app/src/main/AndroidManifest.xml; do echo "=== $f ==="; cat "$f"; done
          find android -name 'MainActivity*' -exec sh -c 'echo "=== $1 ==="; cat "$1"' _ {} \;
      - name: Publish generated android folder to probe branch
        if: false
        run: |
          git config user.name ci && git config user.email ci@example.com
          git add android pubspec.lock pubspec.yaml
          git commit -qm "probe: generated android + resolved pubspec" || true
          git push origin HEAD:claude/probe-generated -f
