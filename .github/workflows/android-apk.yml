name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'claude/**' ]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format lib test

      - name: Commit formatting (work branches only)
        if: github.ref != 'refs/heads/main' && github.event_name == 'push'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git commit -am "style: dart format"
            git push origin HEAD:${{ github.ref_name }} || true
          fi

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk azm-release.apk
          ls -l azm-release.apk
          test -s azm-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: azm-release-apk
          path: azm-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" azm-release.apk --title "Azm latest build" --notes "Automated build from ${GITHUB_SHA}" --target "${GITHUB_SHA}"
